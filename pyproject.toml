[project]
name = "online-mro-paper"
version = "0.1.0"
description = "Paper experiments: online mean-robust optimization (portfolio CVaR + sparse DRO-SVM)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2,<3",
    "pandas>=2.2",
    "scipy>=1.14",
    "cvxpy>=1.6,<1.7",
    "clarabel>=0.10",
    "mosek>=10.2,<11",
    "joblib>=1.4",
    "scikit-learn>=1.5",
    "pot>=0.9",
    "matplotlib>=3.10",
    "psutil>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-xdist>=3.6"]

[tool.pytest.ini_options]
markers = [
    "slow: long-running tests (legacy equivalence); run explicitly with -m slow",
    "mosek: tests requiring a MOSEK license",
]
addopts = "-m 'not slow'"
testpaths = ["tests"]

[tool.uv]
package = false
